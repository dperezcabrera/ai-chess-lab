[project]
name = "ai-chess-lab"
version = "0.6.0"
description = "LLMs, System One models and you at chess: games, Swiss tournaments and leagues, every move and its cost on the record, Stockfish analysis in the browser"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "chess>=1.11,<2",
    "pico-boot>=0.2.0",
    "pico-fastapi[session]>=0.4.1",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pico-testing>=0.2.0", "pytest>=8", "ruff>=0.6"]
laya = ["laya>=0.3.5"]

[project.scripts]
ai-chess-lab = "ai_chess_lab.main:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ai_chess_lab"]

[tool.setuptools.package-data]
ai_chess_lab = ["static/**/*", "models.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
